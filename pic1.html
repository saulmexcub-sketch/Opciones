<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>PIC1 — Wire / Conduit / Sealtight</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#f5f5f7;--surface:#fff;--fg:#1d1d1f;--mu:#6e6e73;
    --ac:#0071e3;--sep:#d2d2d7;--r:12px;
    --f:-apple-system,'SF Pro Display','Helvetica Neue',sans-serif;
  }
  @media(prefers-color-scheme:dark){
    :root{--bg:#000;--surface:#1c1c1e;--fg:#f5f5f7;--mu:#98989d;--sep:#38383a;--ac:#2997ff}
  }
  body{background:var(--bg);color:var(--fg);font-family:var(--f);min-height:100vh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

  /* ── Header ── */
  .hdr{
    position:sticky;top:0;z-index:10;
    background:rgba(245,245,247,.85);
    backdrop-filter:saturate(180%) blur(20px);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    border-bottom:1px solid var(--sep);
    padding:20px 24px 14px;
  }
  @media(prefers-color-scheme:dark){
    .hdr{background:rgba(0,0,0,.85)}
  }
  .hdr-title{
    font-size:13px;font-weight:600;color:var(--mu);
    text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px;
  }

  /* ── Search ── */
  .search-wrap{position:relative}
  .search-icon{
    position:absolute;left:14px;top:50%;transform:translateY(-50%);
    color:var(--mu);pointer-events:none;width:17px;height:17px;
  }
  #search{
    width:100%;background:var(--surface);color:var(--fg);
    border:none;border-radius:10px;
    padding:11px 14px 11px 40px;
    font-size:17px;font-family:var(--f);
    outline:none;-webkit-appearance:none;appearance:none;
    box-shadow:0 1px 3px rgba(0,0,0,.08);
  }
  #search:focus{box-shadow:0 0 0 3px rgba(0,113,227,.35)}
  @media(prefers-color-scheme:dark){
    #search:focus{box-shadow:0 0 0 3px rgba(41,151,255,.35)}
  }
  .clear-btn{
    position:absolute;right:10px;top:50%;transform:translateY(-50%);
    background:var(--mu);color:var(--bg);border:none;border-radius:50%;
    width:18px;height:18px;font-size:11px;cursor:pointer;
    display:none;align-items:center;justify-content:center;font-weight:700;
    line-height:1;
  }
  .clear-btn.show{display:flex}

  /* ── Counter ── */
  .counter{
    font-size:12px;color:var(--mu);padding:8px 24px 2px;
    font-weight:500;letter-spacing:.2px;
  }

  /* ── Results ── */
  .results{padding:8px 16px 32px}
  .no-results{
    text-align:center;padding:60px 24px;
    font-size:17px;color:var(--mu);
  }
  .no-results span{display:block;font-size:40px;margin-bottom:12px}

  /* ── Item ── */
  .item{
    background:var(--surface);border-radius:var(--r);
    margin-bottom:8px;padding:14px 18px;
    display:flex;align-items:center;gap:16px;
    box-shadow:0 1px 3px rgba(0,0,0,.06);
    transition:transform .1s,box-shadow .1s;
    cursor:default;
  }
  .item:active{transform:scale(.98);box-shadow:none}

  /* Part number — the STAR of the show */
  .part{
    font-size:18px;font-weight:700;
    color:var(--ac);font-variant-numeric:tabular-nums;
    letter-spacing:.3px;white-space:nowrap;min-width:96px;
    font-feature-settings:"tnum";
  }
  .desc{
    font-size:15px;color:var(--fg);flex:1;line-height:1.35;
  }

  /* ── Highlight ── */
  mark{
    background:rgba(255,214,10,.45);
    color:inherit;border-radius:3px;padding:0 1px;
  }
  @media(prefers-color-scheme:dark){
    mark{background:rgba(255,214,10,.3)}
  }

  /* ── Group header ── */
  .ghead{
    font-size:11px;font-weight:700;color:var(--mu);
    text-transform:uppercase;letter-spacing:.7px;
    padding:18px 4px 6px;
  }

  /* ── Empty state intro ── */
  .intro{
    text-align:center;padding:48px 24px 24px;
    color:var(--mu);
  }
  .intro-icon{font-size:52px;margin-bottom:12px}
  .intro-title{font-size:22px;font-weight:700;color:var(--fg);margin-bottom:8px}
  .intro-sub{font-size:15px;line-height:1.5}

  @media(min-width:600px){
    .results{padding:8px 24px 40px}
    .hdr{padding:24px 32px 16px}
    .item{padding:16px 22px}
    .part{font-size:20px;min-width:108px}
    .desc{font-size:16px}
    .counter{padding:8px 32px 2px}
  }
</style>

// ── normalise for search ──
function norm(s){ return s.toLowerCase().replace(/[#"\/]/g,' ').replace(/\s+/g,' ').trim(); }
function esc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

function highlight(text, q){
  if(!q) return text;
  const words = q.trim().split(/\s+/).filter(Boolean).map(esc);
  let out = text;
  words.forEach(w=>{
    out = out.replace(new RegExp(`(${w})`, 'gi'), '<mark>$1</mark>');
  });
  return out;
}

function render(q){
  const res = document.getElementById('results');
  const counter = document.getElementById('counter');
  const qn = norm(q||'');
  const words = qn.split(/\s+/).filter(Boolean);

  let matches;
  if(!words.length){
    matches = DATA;
  } else {
    matches = DATA.filter(r=>{
      const hay = norm(r.p+' '+r.d);
      return words.every(w=>hay.includes(w));
    });
  }

  if(!q){
    counter.textContent = `${DATA.length} materiales`;
    res.innerHTML = `<div class="intro">
      <div class="intro-icon">🔌</div>
      <div class="intro-title">Wire / Conduit / Sealtight</div>
      <div class="intro-sub">${DATA.length} partes disponibles.<br>Escribe para buscar al instante.</div>
    </div>`;
    return;
  }

  if(!matches.length){
    counter.textContent = '0 resultados';
    res.innerHTML = `<div class="no-results"><span>🔍</span>Sin resultados para "<strong>${q}</strong>"</div>`;
    return;
  }

  counter.textContent = matches.length === 1 ? '1 resultado' : `${matches.length} resultados`;

  res.innerHTML = matches.map(r=>{
    const ph = highlight(r.p, q);
    const dh = highlight(r.d, q);
    return `<div class="item">
      <div class="part">${ph}</div>
      <div class="desc">${dh}</div>
    </div>`;
  }).join('');
}

// ── Events ──
const input = document.getElementById('search');
const clearBtn = document.getElementById('clearBtn');

input.addEventListener('input', ()=>{
  const v = input.value;
  clearBtn.classList.toggle('show', v.length > 0);
  render(v);
});

function clearSearch(){
  input.value='';
  clearBtn.classList.remove('show');
  render('');
  input.focus();
}
